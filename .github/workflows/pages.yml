name: Verify and publish Fieldnotes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify site and analytical regressions
        run: |
          mkdir -p audit
          node pipeline/verify_site.cjs
          node pipeline/verify_app.cjs
          node pipeline/verify_replay_app.cjs
          node pipeline/verify_workbench.cjs
          node pipeline/verify_release05.cjs
  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
